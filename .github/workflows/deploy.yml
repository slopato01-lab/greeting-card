name: Deploy to Cloudflare Pages

# ВНИМАНИЕ: автодеплой по push отключён намеренно.
#
# Воркфлоу выкладывает корень репозитория как есть, без сборки. После
# сброса проекта в корне лежит только документация, поэтому запуск по
# push обнулил бы прод. Cloudflare Pages продолжает отдавать последний
# успешный деплой, пока нового не было.
#
# Триггер push возвращается вместе с каркасом Next.js — тогда же команда
# ниже меняется на сборку и деплой готовой директории, а не корня.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверка секретов
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Секрет CLOUDFLARE_API_TOKEN пуст или не задан (Settings → Secrets and variables → Actions)"; exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0d6efe3fc70e82760b76c47fd63ee406
          command: pages deploy . --project-name=greeting-card --branch=main
