# pnpm 11 читает настройки отсюда, а не из поля "pnpm" в package.json.
# Разрешаем postinstall только этим пакетам: без него не распакуются
# бинарники сборщика, обработчика картинок и локального рантайма Workers.
allowBuilds:
  # canvas — необязательная зависимость fabric для рендера в Node.
  # Редактор рисует только в браузере, нативная сборка не нужна.
  canvas: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
